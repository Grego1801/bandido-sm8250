name: Build Kernel

on:
  push:
    branches:
      - bandido
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison build-essential ccache curl flex git \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          libssl-dev libncurses5-dev libncurses-dev \
          lzop python3 unzip zip wget

      - name: Download Proton Clang
        run: |
          # Fast clone
          git clone --depth=1 --single-branch https://github.com/kdrag0n/proton-clang.git clang

      - name: Install KernelSU (Fresh)
        run: |
          # Remove any leftover folders to prevent conflicts
          rm -rf KernelSU drivers/kernelsu drivers/ksu
          
          # Official installer (Installs to drivers/kernelsu)
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Build Kernel
        run: |
          # Fix Kconfig: Delete any existing KSU lines and add a fresh one
          sed -i '/kernelsu/d' drivers/Kconfig
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          
          # Fix Makefile: Delete any existing KSU lines and add a fresh one
          sed -i '/kernelsu/d' drivers/Makefile
          echo 'obj-y += kernelsu/' >> drivers/Makefile

          # Environment Setup
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$PWD/clang/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KCONFIG_NONINTERACTIVE=1
          mkdir -p out

          # Configuration
          make O=out ARCH=arm64 vendor/r8q_eur_open_defconfig
          make O=out ARCH=arm64 olddefconfig

          # Compilation
          make -j$(nproc) \
          O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=$CLANG_TRIPLE \
          CROSS_COMPILE=$CROSS_COMPILE \
          CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtb*

