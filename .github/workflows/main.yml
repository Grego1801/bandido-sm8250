name: Build Kernel

on:
  push:
    branches:
      - bandido
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison build-essential ccache curl flex git \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          libssl-dev libncurses5-dev libncurses-dev \
          lzop python3 unzip zip wget

      - name: Cache Proton Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: proton-clang

      - name: Download Proton Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$PWD/clang/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KCONFIG_NONINTERACTIVE=1
          mkdir -p out
          make O=out ARCH=arm64 vendor/r8q_eur_open_defconfig
          make O=out ARCH=arm64 olddefconfig
          make -j$(nproc) \
          O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=$CLANG_TRIPLE \
          CROSS_COMPILE=$CROSS_COMPILE \
          CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtb*
