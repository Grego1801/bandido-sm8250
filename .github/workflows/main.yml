name: Build Kernel

on:
  push:
    branches:
      - bandido
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison build-essential ccache curl flex git \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          libssl-dev libncurses5-dev libncurses-dev \
          lzop python3 unzip zip wget binutils-aarch64-linux-gnu

      - name: Cache Proton Clang
        uses: actions/cache@v4
        with:
          path: clang
          key: proton-clang-Linux-v1

      - name: Download Proton Clang
        run: |
          if [ ! -d "clang" ]; then
            git clone --depth=1 --single-branch https://github.com/kdrag0n/proton-clang.git clang
          fi

      - name: Build Kernel
        run: |
          # 1. Environment Setup
          # These ensure Clang targets ARM64 correctly to avoid the 'sp' register errors
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$PWD/clang/bin:$PATH
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KCONFIG_NONINTERACTIVE=1
          
          mkdir -p out

          # 2. Configuration
          # Using your specific defconfig
          make O=out ARCH=arm64 vendor/r8q_eur_open_defconfig
          
          # 3. Apply Config Tweaks (Critical for Samsung/Qualcomm vendor sources)
          # These are config-level, not source-level, so they stay here.
          scripts/config --file out/.config --disable CONFIG_SECURITY_SMACK
          scripts/config --file out/.config --disable CONFIG_SMACK
          scripts/config --file out/.config --disable CONFIG_EXYNOS_MFC
          scripts/config --file out/.config --disable CONFIG_FIRMWARE_IN_KERNEL
          
          # 4. Ensure KernelSU is enabled in config
          scripts/config --file out/.config --enable CONFIG_KPROBES
          scripts/config --file out/.config --enable CONFIG_HAVE_KPROBES
          scripts/config --file out/.config --enable CONFIG_KALLSYMS
          scripts/config --file out/.config --enable CONFIG_KALLSYMS_ALL
          scripts/config --file out/.config --enable CONFIG_MODULES
          scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
          scripts/config --file out/.config --enable CONFIG_KSU
          
          # Sync the config changes
          yes "" | make O=out ARCH=arm64 oldconfig

          # 5. Compilation
          # Using the full LLVM suite for the most stable build
          make -j$(nproc) \
          O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=$CLANG_TRIPLE \
          CROSS_COMPILE=$CROSS_COMPILE \
          CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          HOSTCFLAGS="-fcommon" \
          KCFLAGS="-Wno-error -fcommon -Wno-incompatible-pointer-types -Wno-implicit-function-declaration"

      - name: Upload kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtb*
