name: Build Kernel

on:
  push:
    branches:
      - bandido
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison build-essential ccache curl flex git \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          libssl-dev libncurses5-dev libncurses-dev \
          lzop python3 unzip zip wget

      - name: Cache Proton Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: proton-clang

      - name: Download Proton Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --single-branch https://github.com/kdrag0n/proton-clang.git clang

      - name: Install KernelSU (Fresh)
        run: |
          # Clean messy folders to ensure fresh install
          rm -rf KernelSU drivers/kernelsu drivers/ksu
          # Official installer puts files in drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Build Kernel
        run: |
          # 1. Patch Kconfig & Makefile
          sed -i '/ksu/d' drivers/Kconfig
          sed -i '/kernelsu/d' drivers/Kconfig
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          
          sed -i '/ksu/d' drivers/Makefile
          sed -i '/kernelsu/d' drivers/Makefile
          echo 'obj-y += kernelsu/' >> drivers/Makefile

          # 2. Environment Setup
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$PWD/clang/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KCONFIG_NONINTERACTIVE=1
          
          # Fix for 'multiple definition of yylloc'
          export HOSTCFLAGS="-fcommon"
          
          mkdir -p out

          # 3. Configuration
          make O=out ARCH=arm64 vendor/r8q_eur_open_defconfig
          
          # Enable KSU and required dependencies
          scripts/config --file out/.config --enable CONFIG_KPROBES
          scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
          scripts/config --file out/.config --enable CONFIG_KSU
          
          make O=out ARCH=arm64 olddefconfig

          # 4. Compilation
          # Added LD=ld.lld to fix "unrecognised emulation mode"
          # Added -Wno-error to prevent build stops on trivial warnings
          make -j$(nproc) \
          O=out \
          ARCH=arm64 \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          HOSTCFLAGS="$HOSTCFLAGS" \
          KCFLAGS="-Wno-error" \
          CLANG_TRIPLE=$CLANG_TRIPLE \
          CROSS_COMPILE=$CROSS_COMPILE \
          CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtb*

